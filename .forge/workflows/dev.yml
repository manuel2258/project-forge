version: 1
description: Code changes to forge itself — refine, plan, implement, check, review, merge.
initial: refining
import: [common.yml]

states:
  refining:
    # **A conversation, not a job** (`docs/design/workflow-grammar-v1.md` § Chat steps): the ticket
    # opens a chat on entry, `agents/refine.md` has the agent grill the person phase by phase, and
    # the step ends only when the person presses Accept — which is also the approval of
    # `refinement.md` that `planning` waits on, pinned to the version the person was shown. So the
    # approval this state always had is now the end of a conversation with the person approving,
    # rather than a document from an agent that could not ask them anything.
    chat: true
    prompt: agents/refine.md
    env: default
    # **Opus, which this state was not while it was a job.** Then it was a restatement a person
    # read once, and a weak reading was caught by the approval. Now the value is in the questions:
    # the decision nobody thought to make, the earlier ticket that settled it, the guard a feature
    # needs. That is judgement, and every answer it fails to get is a guess `planning` makes on
    # its own. `high` and not `xhigh` because a person waits for every turn.
    #
    # **No `budget`, and the validator refuses one**: a chat step has no ceiling, and its spend is
    # added to the ticket's. `.forge/common.yml` derives the $30 of `limits.ticket_cost` it leaves
    # the conversation, and why that is a guess.
    model: opus
    effort: high
    inputs: [ticket]
    produces: [refinement.md]

  # `implementation.md` is here for the same reason `bug.yml`'s `diagnosing` reads it: the ticket
  # comes back on `plan_invalid`, and a re-plan that cannot read why re-derives the same plan. It
  # is optional — the way in from `refining` has written no implementation.
  planning:
    prompt: agents/plan.md
    env: default
    # **The dial this workflow leans hardest on, and the cheapest state to lean on.** Nobody
    # approves `plan.md` and `implementing` starts on it as written, so this reading is the last
    # one before code is written against it — and at $4 it is the one place where buying more
    # thinking is nearly free. `xhigh` is deliberately above `implementing`'s `high`: the
    # groundwork is worth more here than there, because a plan that is wrong is paid for twice —
    # once in `implementing`, again in the `plan_invalid` round-trip — and that round-trip is now
    # bounded at two, so a third wrong plan sticks the ticket rather than buying another lap.
    model: opus
    effort: xhigh
    inputs: [ticket, refinement.md, implementation.md]
    produces: [plan.md]
    budget: { turns: 80, cost: 4.00 }

  implementing:
    prompt: agents/implement.md
    env: default
    # **Sonnet, which is the largest single saving in this file, and the one to undo first if
    # quality moves.** `planning` above is on opus at `xhigh` precisely so that this state is
    # executing a decided plan rather than making the decisions itself, and `implementing` already
    # has the three things that make a cheaper model workable here: a plan it did not write, a gate
    # it can run ten times (`may_invoke` below), and `plan_invalid` for a plan that does not
    # survive contact with the code.
    #
    # **But `high` and not `low`, which is the part worth not getting wrong.** What this state does
    # is long: read a plan, change files, run `bin/check`, watch a new test fail and put the code
    # back (`CLAUDE.md` § Testing), fix what the gate says, go round again. A low-effort run's
    # failure mode is stopping early — skipping the mutation it was told to watch, calling a gate
    # run it has not read a pass — and that failure is not caught here, it is caught in `reviewing`
    # at $35 a round. Saving $10 on this state by spending $35 on another review round, twice, is
    # how a cost cut becomes a cost rise. So: cheap model, still thinking hard, and the review loop
    # is the meter that says whether that held.
    #
    # Turns go to 300 with the model, not as a separate judgement: $15 buys several times the
    # tokens on sonnet that it bought on opus, so at 200 the turn ceiling would quietly become the
    # binding limit — and a job its turn ceiling stops throws away everything it spent, which is
    # the rule `.forge/common.yml`'s `presenting` states and this would have broken silently.
    model: sonnet
    effort: high
    may_invoke:
      check: { max: 10 }
    inputs: [ticket, refinement.md, plan.md, report.md]
    produces: [implementation.md, changeset]
    outcomes: [done, plan_invalid]
    budget: { turns: 300, cost: 15.00 }

  checking:
    extends: checking

  # `report.md` is this state's own last version, and optional: the way in from `checking` on a
  # first pass has written no review. It is here so that a second round can verify the fixes to
  # what it found and read only what changed since, rather than re-deriving the whole diff at
  # full price — ticket 7's second review spent $21.96 doing exactly that, and its fifth, scoped,
  # cost $4.13.
  #
  # `rebase.md` too, and optional for the same reason: only a ticket a rebase sent back on
  # `needs_review` has one. That review is scoped to the rebase and not to the change a person
  # already approved (`agents/review.md` § After a rebase, review the rebase), and the
  # presentation says what the rebase did, because that is what the person approves this time.
  reviewing:
    extends: reviewing
    inputs: [refinement.md, plan.md, implementation.md, report.md, rebase.md, changeset]

  presenting:
    extends: presenting
    inputs: [refinement.md, plan.md, implementation.md, report.md, rebase.md, changeset]

  review_ready: {}

  merged:
    extends: merged

  # `refinement.md` because `agents/rebase.md` asks for a resolution that still satisfies the
  # acceptance criteria rather than one that merely merges, and until it was listed here the
  # prompt named a document the state was never handed. Found by reading the prompt against the
  # workflow; the validator cannot catch it, because an input a prompt mentions is prose.
  rebasing:
    extends: rebasing
    inputs: [refinement.md, plan.md, changeset]

# The work of the ticket, then the edges for the engine's own outcomes. `bug.yml`'s transitions
# carry the reasoning; it is the same here, for the same states.
transitions:
  - { from: refining,     to: planning,     approve: [refinement.md] }
  - { from: planning,     to: implementing }
  - { from: implementing, to: checking }
  - { from: implementing, to: planning,     when: plan_invalid,      max: 2 }
  - { from: checking,     to: reviewing }
  - { from: checking,     to: implementing, when: checks_failed,     max: 3 }
  - { from: reviewing,    to: presenting }
  - { from: reviewing,    to: implementing, when: issues_found,      max: 5 }
  - { from: presenting,   to: review_ready }
  - { from: review_ready, to: merged,       approve: [changeset], queue: true }
  - { from: rebasing,     to: merged,       queue: true }
  - { from: rebasing,     to: checking,     when: needs_review }

  - { from: checking,     to: checking,     when: gate_unavailable,  max: 2 }
  - { from: planning,     to: planning,     when: budget_exhausted,  max: 1 }
  - { from: planning,     to: planning,     when: did_not_converge,  max: 1 }
  - { from: implementing, to: implementing, when: budget_exhausted,  max: 1 }
  - { from: implementing, to: implementing, when: did_not_converge,  max: 1 }
  - { from: reviewing,    to: presenting,   when: budget_exhausted }
  - { from: reviewing,    to: reviewing,    when: did_not_converge,  max: 1 }
  - { from: presenting,   to: presenting,   when: budget_exhausted,  max: 1 }
  - { from: presenting,   to: presenting,   when: did_not_converge,  max: 1 }

limits:
  # $361 and not $120 because `reviewing` costs $35 and its loop runs five times, and because the
  # refinement conversation and the rebases after the approval spend under the same cap:
  # `.forge/common.yml` derives the figure beside the review budget and the bounds it follows from.
  # `project_workflows_test.exs` computes it from this file rather than trusting the comment.
  ticket_cost: 361.00
