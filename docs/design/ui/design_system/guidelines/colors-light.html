<!-- @dsCard group="Colors" viewport="700x170" name="Light theme" subtitle="Cool neutrals; accents deepen for text" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}.m{font-family:var(--font-mono)}</style></head><body data-theme="light">
<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--bg);border:1px solid var(--border)"></div><span style="font-size:12.5px">page</span><span class="m" style="font-size:10.5px;opacity:.55">--bg</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border)"></div><span style="font-size:12.5px">selected</span><span class="m" style="font-size:10.5px;opacity:.55">--surface-2</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--border);border:1px solid var(--border)"></div><span style="font-size:12.5px">rule</span><span class="m" style="font-size:10.5px;opacity:.55">--border</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--ink);border:1px solid var(--border)"></div><span style="font-size:12.5px">text</span><span class="m" style="font-size:10.5px;opacity:.55">--ink</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--accent);border:1px solid var(--border)"></div><span style="font-size:12.5px">amber fill</span><span class="m" style="font-size:10.5px;opacity:.55">--accent</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--accent-text);border:1px solid var(--border)"></div><span style="font-size:12.5px">amber as text</span><span class="m" style="font-size:10.5px;opacity:.55">--accent-text</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--link);border:1px solid var(--border)"></div><span style="font-size:12.5px">link</span><span class="m" style="font-size:10.5px;opacity:.55">--link</span></div></div></body></html>
