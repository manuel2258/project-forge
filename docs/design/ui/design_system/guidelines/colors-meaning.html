<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}.m{font-family:var(--font-mono)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--accent);border:1px solid var(--border)"></div><span style="font-size:12.5px">waits on you</span><span class="m" style="font-size:10.5px;opacity:.55">--accent</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--info);border:1px solid var(--border)"></div><span style="font-size:12.5px">running</span><span class="m" style="font-size:10.5px;opacity:.55">--info</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--success);border:1px solid var(--border)"></div><span style="font-size:12.5px">passed · added</span><span class="m" style="font-size:10.5px;opacity:.55">--success</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--warning);border:1px solid var(--border)"></div><span style="font-size:12.5px">near a limit</span><span class="m" style="font-size:10.5px;opacity:.55">--warning</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--danger);border:1px solid var(--border)"></div><span style="font-size:12.5px">failed · destructive</span><span class="m" style="font-size:10.5px;opacity:.55">--danger</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--link);border:1px solid var(--border)"></div><span style="font-size:12.5px">link · selected</span><span class="m" style="font-size:10.5px;opacity:.55">--link</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--doc);border:1px solid var(--border)"></div><span style="font-size:12.5px">document</span><span class="m" style="font-size:10.5px;opacity:.55">--doc</span></div></div></body></html>
