version: 1
description: Bug fixes to forge itself — reproduce, diagnose, fix the class, review, merge.
initial: refining
import: [common.yml]

states:
  # A conversation that ends on the person's Accept, on opus at `high` and with no budget, all for
  # the reasons `dev.yml`'s `refining` carries: it is the same step, grilling for a defect rather
  # than a feature (`agents/refine-bug.md`). `env` matters more here than there, because the first
  # thing the agent is asked to do is reproduce the bug, and that needs the devshell.
  refining:
    chat: true
    prompt: agents/refine-bug.md
    env: default
    model: opus
    effort: high
    inputs: [ticket]
    produces: [refinement.md]

  # `implementation.md` is here because `implementing` sends the ticket back on
  # `diagnosis_invalid`, and a re-diagnosis that cannot read why it was sent back re-derives the
  # same diagnosis. It is optional — the way in from `refining` has written no implementation —
  # so the first diagnosis is handed nothing and told so.
  diagnosing:
    prompt: agents/diagnose.md
    env: default
    # Finding why something is wrong rather than where it surfaced, and then every other site with
    # the same defect (`agents/diagnose.md`, `CLAUDE.md` § Rules), is the judgement this workflow
    # is for. Nobody approves `diagnosis.md`, and `implementing` fixes what this names and nothing
    # else. Opus at `xhigh`, for the reason `dev.yml`'s `planning` carries: at $4 this is the
    # cheapest place in the workflow to buy thinking, and a wrong diagnosis is paid for twice.
    model: opus
    effort: xhigh
    inputs: [ticket, refinement.md, implementation.md]
    produces: [diagnosis.md]
    budget: { turns: 80, cost: 4.00 }

  implementing:
    prompt: agents/implement-bug.md
    env: default
    # Sonnet at `high` and 300 turns, all three for the reasons `dev.yml`'s `implementing` carries
    # at length: it is the same state, `diagnosing` above does the thinking this one executes, and
    # `diagnosis_invalid` is its edge for a diagnosis that does not survive the code.
    model: sonnet
    effort: high
    may_invoke:
      check: { max: 10 }
    inputs: [ticket, refinement.md, diagnosis.md, report.md]
    produces: [implementation.md, changeset]
    outcomes: [done, diagnosis_invalid]
    budget: { turns: 300, cost: 15.00 }

  checking:
    extends: checking

  # `report.md` is this state's own last version, and optional: the way in from `checking` on a
  # first pass has written no review. It is here so that a second round can verify the fixes to
  # what it found and read only what changed since, rather than re-deriving the whole diff at
  # full price — ticket 7's second review spent $21.96 doing exactly that, and its fifth, scoped,
  # cost $4.13.
  #
  # `rebase.md` too, and optional for the same reason: only a ticket a rebase sent back on
  # `needs_review` has one. That review is scoped to the rebase and not to the change a person
  # already approved (`agents/review.md` § After a rebase, review the rebase), and the
  # presentation says what the rebase did, because that is what the person approves this time.
  reviewing:
    extends: reviewing
    inputs: [refinement.md, diagnosis.md, implementation.md, report.md, rebase.md, changeset]

  presenting:
    extends: presenting
    inputs: [refinement.md, diagnosis.md, implementation.md, report.md, rebase.md, changeset]

  review_ready: {}

  merged:
    extends: merged

  # `refinement.md` for the reason `dev.yml`'s `rebasing` carries: the prompt is written against
  # the acceptance criteria and did not get them.
  rebasing:
    extends: rebasing
    inputs: [refinement.md, diagnosis.md, changeset]

# The work of the ticket, first. Then the edges for the engine's own outcomes, which exist
# because a job that runs out of budget or stops without an answer used to leave the ticket
# stuck for a person to re-point at the state it had just left — three of ticket 1's four human
# interventions were exactly that, one of them for ninety minutes.
#
# One extra attempt each and no more: `max` is what keeps a retry from becoming a loop that
# spends the cost cap. `error` and `cancelled` are deliberately unhandled — `error` is something
# broken rather than something unfinished, and a cancelled ticket takes no transition at all —
# so both still stick, which is the right default for a fault nobody has read.
#
# **`reviewing` is the one state whose exhaustion is not retried.** A review that ran out of money
# spent it on subagents whose work a fresh attempt throws away, so the retry reached the same wall
# at the same price; `.forge/common.yml` has the runs that showed it. The edge goes forward to
# `presenting` instead — and from there to `review_ready`, where a person already reads
# `report.md` beside the diff, so a partial report lands in front of someone who can decide.
# `presenting` and not `review_ready` directly because every way to `review_ready` goes through
# it: a review that ran out of money is exactly the one whose diff a person needs narrated, and
# at $3 it cannot repeat what exhausted the review. It carries no `max`, which is safe only while
# nothing routes back into `reviewing` from there: `max: nil` never exhausts, so an edge from
# `review_ready` towards `implementing` would make this an uncapped loop and would have to cap it.
# That is no longer left to whoever adds the edge: `project_workflows_test.exs` asserts that the
# graph of unbounded edges is acyclic, so such an edge fails the gate.
# `did_not_converge` keeps its retry: that is a review that had the budget and no answer, which
# another attempt can change.
#
# `refining` gets none of these either, and needs none: it is a chat step, which no engine outcome
# ends — nothing in it happens without a person, and an edge on one would never fire.
#
# `rebasing` gets none of these, and cannot: it is `merged`'s `on_conflict`, and the validator
# refuses a state reached by a conflict that any transition also leads into. The rule is right —
# a rebase is a route out of a conflict, not a step anything else may jump into — and it was found
# by running the parser over this file rather than by reading it. It leaves on its own two
# outcomes, which `.forge/common.yml` explains: `done` straight back into the merge queue, and
# `needs_review` through `checking` to a person. Neither carries a `max`, and needs none: the
# platform bounds the queue's conflict loop at three rebases in a row, and `needs_review` reaches
# `merged` again only through `review_ready`'s approval, which is a person.
transitions:
  - { from: refining,     to: diagnosing,   approve: [refinement.md] }
  - { from: diagnosing,   to: implementing }
  - { from: implementing, to: checking }
  - { from: implementing, to: diagnosing,   when: diagnosis_invalid, max: 2 }
  - { from: checking,     to: reviewing }
  - { from: checking,     to: implementing, when: checks_failed,     max: 3 }
  - { from: reviewing,    to: presenting }
  - { from: reviewing,    to: implementing, when: issues_found,      max: 5 }
  - { from: presenting,   to: review_ready }
  - { from: review_ready, to: merged,       approve: [changeset], queue: true }
  - { from: rebasing,     to: merged,       queue: true }
  - { from: rebasing,     to: checking,     when: needs_review }

  - { from: checking,     to: checking,     when: gate_unavailable,  max: 2 }
  - { from: diagnosing,   to: diagnosing,   when: budget_exhausted,  max: 1 }
  - { from: diagnosing,   to: diagnosing,   when: did_not_converge,  max: 1 }
  - { from: implementing, to: implementing, when: budget_exhausted,  max: 1 }
  - { from: implementing, to: implementing, when: did_not_converge,  max: 1 }
  - { from: reviewing,    to: presenting,   when: budget_exhausted }
  - { from: reviewing,    to: reviewing,    when: did_not_converge,  max: 1 }
  - { from: presenting,   to: presenting,   when: budget_exhausted,  max: 1 }
  - { from: presenting,   to: presenting,   when: did_not_converge,  max: 1 }

limits:
  # $361 and not $120 because `reviewing` costs $35 and its loop runs five times, and because the
  # refinement conversation and the rebases after the approval spend under the same cap:
  # `.forge/common.yml` derives the figure beside the review budget and the bounds it follows from.
  # `project_workflows_test.exs` computes it from this file rather than trusting the comment.
  ticket_cost: 361.00
