defaults:
  resources: { memory: 2200MiB, cpu: 1 }

commands:
  check:
    run: .forge/commands/check.sh
    env: default
    produces: check.log
    timeout: 20m
    # **Two cores and not four: that is what the machines here have.** `cpu` is a reservation and
    # never a quota — the slice gets `CPUWeight` and nothing sets `CPUQuota` — so the gate is the
    # only thing the number talks to, and `mix check` on an idle machine still uses all of it.
    # What two gives up is exclusivity, not speed. The memory stays 4 GiB because that one is a
    # hard ceiling: too small is a SIGKILL rather than a slow run.
    # `.forge/workflows/release.yml` carries the longer form, found when `release-build` asked for
    # six cores and stuck ticket 8 before a machine.
    resources: { memory: 4GiB, cpu: 2 }

states:
  # `2` is the gate saying it could not run at all, which is not the gate saying no: the machine
  # is missing the devshell or a database it cannot start (`.forge/commands/check.sh`). It gets
  # its own outcome so that an environment failure does not spend the bound that exists for a fix
  # which keeps failing — three of ticket 1's three `checks_failed` were the machine's.
  checking:
    invoke: [check]
    exit: { 0: done, 2: gate_unavailable, "*": checks_failed }

  # **The cost is sized for a review that fans out, not for one top-level agent.**
  # `agents/review.md` runs the `review` skill, which dispatches a subagent per lens and a
  # verifier per finding, and the budget is checked between the top-level agent's turns — so a
  # whole fan-out lands inside one turn and the cap is seen only after it. At $15 that cap was
  # crossed by five reviews on 2026-10-20 (forge#6 ×2, forge#7 ×3) between one and eight
  # top-level turns in, each having spent its $15 almost exactly, while the two that did report
  # cost $9.70 and $19.53 — one of them over the cap and allowed through only because nothing
  # looks until the turn ends. $35 is above the one measured converging run that exceeded $15,
  # with room for the mutation lens. Turns stay at 120: not one of the five exhausted runs came
  # near them, so they were never the binding limit.
  reviewing:
    prompt: agents/review.md
    env: default
    model: opus
    produces: [report.md]
    outcomes: [done, issues_found]
    budget: { turns: 120, cost: 35.00 }

  merged:
    on_enter: merge
    on_conflict: integrating

  integrating:
    prompt: agents/integrate.md
    env: default
    model: opus
    produces: [integration.md, changeset]
    budget: { turns: 100, cost: 8.00 }
