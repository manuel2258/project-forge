<!-- @dsCard group="Colors" viewport="700x140" name="Usage thresholds" subtitle="Quiet until it matters; never amber" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}.m{font-family:var(--font-mono)}</style></head><body>
<div style="display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;margin-bottom:12px"><span class="m" style="font-size:11.5px;opacity:.7">normal · 42 / 18</span><div><div style="height:3px;background:var(--track)"><div style="height:100%;width:42%;background:color-mix(in oklch, var(--ink) 60%, transparent)"></div></div><div style="height:14px;background:var(--surface-2)"></div><div style="height:2px;background:var(--track)"><div style="height:100%;width:18%;background:color-mix(in oklch, var(--ink) 60%, transparent)"></div></div></div></div><div style="display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;margin-bottom:12px"><span class="m" style="font-size:11.5px;opacity:.7">≥80% warning · 86 / 40</span><div><div style="height:3px;background:var(--track)"><div style="height:100%;width:86%;background:var(--warning)"></div></div><div style="height:14px;background:var(--surface-2)"></div><div style="height:2px;background:var(--track)"><div style="height:100%;width:40%;background:color-mix(in oklch, var(--ink) 60%, transparent)"></div></div></div></div><div style="display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;margin-bottom:12px"><span class="m" style="font-size:11.5px;opacity:.7">≥95% danger · 97 / 63</span><div><div style="height:3px;background:var(--track)"><div style="height:100%;width:97%;background:var(--danger)"></div></div><div style="height:14px;background:var(--surface-2)"></div><div style="height:2px;background:var(--track)"><div style="height:100%;width:63%;background:color-mix(in oklch, var(--ink) 60%, transparent)"></div></div></div></div></body></html>
