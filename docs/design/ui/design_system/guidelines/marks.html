<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}.m{font-family:var(--font-mono)}</style></head><body>
<div style="display:flex;flex-wrap:wrap;gap:22px;align-items:center" class="m"><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="font-size:20px;color:var(--accent)">◆</span><span style="font-size:10.5px;opacity:.6">waits on you</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="font-size:20px;color:var(--info)">▸</span><span style="font-size:10.5px;opacity:.6">running</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="font-size:20px;color:var(--link)">●</span><span style="font-size:10.5px;opacity:.6">step</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="font-size:20px;color:var(--success)">✓</span><span style="font-size:10.5px;opacity:.6">done</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="font-size:20px;color:var(--danger)">✗</span><span style="font-size:10.5px;opacity:.6">failed</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="font-size:20px;color:var(--warning)">◇</span><span style="font-size:10.5px;opacity:.6">unapproved doc</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="font-size:20px;color:var(--ink-3)">○</span><span style="font-size:10.5px;opacity:.6">idle</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="font-size:20px;color:var(--ink)">›</span><span style="font-size:10.5px;opacity:.6">navigates</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><span style="font-size:20px;color:var(--ink)">▾ ▴</span><span style="font-size:10.5px;opacity:.6">menu</span></div></div></body></html>
