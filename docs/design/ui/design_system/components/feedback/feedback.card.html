<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}button{font:inherit}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../components/_preview.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
(async () => {
const NS = await loadForge('../../');
const { Notice, Toast, Sheet } = NS;
const App = () => <div style={{ padding:16, display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
  <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
    <Notice tone="accent" title="1 open question will stay unanswered">“Outside the top 10, what does your row show?”</Notice>
    <Notice tone="danger" title="Does not merge cleanly">main moved since this branch started.</Notice>
  </div>
  <div style={{ position:'relative', height:280, border:'1px solid var(--border)', borderRadius:10, overflow:'hidden' }}>
    <Toast title="Approved changeset v1" detail="merging started" bottom={200} />
    <Sheet title="New in game"><div style={{ fontSize:13, opacity:.7 }}>Bottom sheet: only for things opened from the bottom.</div></Sheet>
  </div>
</div>;
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script></body></html>
