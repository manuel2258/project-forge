<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}button{font:inherit}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../components/_preview.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
(async () => {
const NS = await loadForge('../../');
const { Field, Segmented, ChoiceRow, Stepper, Composer } = NS;
const App = () => <div style={{ padding:16, display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
  <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
    <Field label="Name" value="leaderboard-api" mono hint="Lowercase, digits and hyphens." />
    <Field label="Add someone" value="sam@example.com" mono error="No approved account for that address." />
    <Segmented options={['none','read','read and write']} value="none" />
    <div style={{ display:'flex', alignItems:'center', gap:12 }}><span style={{ flex:1, fontSize:13, opacity:.7 }}>Days it lasts</span><Stepper value={7} /></div>
  </div>
  <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
    <ChoiceRow label="Your rank and score" recommended selected />
    <ChoiceRow label="Only your score" />
    <ChoiceRow label="Retry implementing" detail="A fresh attempt with the same budget." />
    <ChoiceRow label="ASSET_CDN_TOKEN" multi selected />
    <div style={{ border:'1px solid var(--border)', borderRadius:10, overflow:'hidden' }}><Composer placeholder="Ask the chat about this" /></div>
  </div>
</div>;
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script></body></html>
