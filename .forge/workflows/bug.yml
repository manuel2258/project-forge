version: 1
description: Bug fixes to forge itself — reproduce, diagnose, fix the class, check, review, merge.
initial: refining
import: [common.yml]

states:
  refining:
    prompt: agents/refine-bug.md
    env: default
    inputs: [ticket]
    produces: [refinement.md]
    budget: { turns: 20, cost: 1.00 }

  diagnosing:
    prompt: agents/diagnose.md
    env: default
    inputs: [ticket, refinement.md]
    produces: [diagnosis.md]
    budget: { turns: 30, cost: 2.00 }

  implementing:
    prompt: agents/implement-bug.md
    env: default
    model: opus
    may_invoke:
      check: { max: 10 }
    inputs: [ticket, refinement.md, diagnosis.md, report.md]
    produces: [implementation.md, changeset]
    outcomes: [done, diagnosis_invalid]
    budget: { turns: 150, cost: 8.00 }

  checking:
    extends: checking

  reviewing:
    extends: reviewing
    inputs: [refinement.md, diagnosis.md, implementation.md, changeset]

  review_ready: {}

  merged:
    extends: merged

  integrating:
    extends: integrating
    inputs: [diagnosis.md, changeset]

transitions:
  - { from: refining,     to: diagnosing,   approve: [refinement.md] }
  - { from: diagnosing,   to: implementing }
  - { from: implementing, to: checking }
  - { from: implementing, to: diagnosing,   when: diagnosis_invalid }
  - { from: checking,     to: reviewing }
  - { from: checking,     to: implementing, when: checks_failed, max: 3 }
  - { from: reviewing,    to: review_ready }
  - { from: reviewing,    to: implementing, when: issues_found,  max: 3 }
  - { from: review_ready, to: merged,       approve: [changeset] }
  - { from: integrating,  to: checking }

limits:
  ticket_cost: 45.00
