version: 1
description: Cut and publish a forge release — version bump, platform image, Hetzner snapshot.
# **The project's release** (`docs/design/ticket-types.md` § Releases): a project admin starts one
# from the project page with an optional note, which is the ticket's body and so its `ticket`
# input; the New ticket form no longer offers this type. The ticket is titled *Release in progress*
# until `release-notes.md`'s front matter names the version (`agents/release-plan.md`), and then
# carries that. **It concludes by itself**: the approval of `release-notes.md` is the one a person
# gives, and a publish that went as planned merges with no second one (the transitions below).
release: true
initial: refining

defaults:
  resources: { memory: 2200MiB, cpu: 1 }

commands:
  ghcr-check:
    run: .forge/commands/ghcr-check.sh
    env: default
    secrets: [GHCR_TOKEN]
    produces: ghcr-check.log
    timeout: 2m

  hetzner-check:
    run: .forge/commands/hetzner-check.sh
    env: default
    secrets: [HCLOUD_TOKEN, HETZNER_PRIVATE_KEY]
    produces: hetzner-check.log
    timeout: 5m

  # **`4GiB, cpu: 2`, sized against the machines this node actually runs.** `release-build` asked
  # for `8GiB, cpu: 6` and `hetzner-snapshot` for `6GiB, cpu: 4` — numbers nobody had checked
  # against a machine, and ticket 8's `release-build` invocation stuck the ticket before anything
  # was built: no machine serving the project can hold that even when empty, and the scheduler
  # refuses such a demand rather than queueing it (`docs/design/commands.md` § Resources,
  # `{:no_template, :none_fit}`). The cores are the operator's figure, two being what a machine
  # here has; the memory is `check`'s in `common.yml`, the heaviest declaration this fleet is known
  # to satisfy.
  #
  # **Two cores does not make the build run on two.** `cpu` is a reservation and never a quota —
  # the slice gets `CPUWeight` and no `CPUQuota` (`worker/lib/forge_worker/slice.ex`) — so what it
  # decides is whether the job places and how much room it holds against other work, not how fast
  # `nix build` goes. A release that finds its machine idle uses all of it. What a low number
  # gives up is exclusivity: another job may land beside a 30-minute image build and compete for
  # the machine's memory.
  #
  # `memory` is the opposite and must not be shaved: it is the slice's hard ceiling, where too
  # small is SIGKILL (status 137) partway through a publish that `publishing` has no retry
  # transition to recover. Raise it by giving the project a bigger machine.
  #
  # Neither script's binding constraint is modelled here: both spool a whole image through
  # `$TMPDIR` — a ~1.25 GB platform archive, a ~1.8 GiB qcow2 converted to raw — and there is no
  # `disk` key in the grammar. A failure for want of room says so in the log and is not the gate.
  release-build:
    run: .forge/commands/release-build.sh
    env: default
    secrets: [GHCR_TOKEN]
    produces: release-build.log
    timeout: 30m
    resources: { memory: 4GiB, cpu: 2 }

  hetzner-snapshot:
    run: .forge/commands/hetzner-snapshot.sh
    env: default
    secrets: [HCLOUD_TOKEN, HETZNER_PRIVATE_KEY]
    produces: hetzner-snapshot.log
    timeout: 30m
    resources: { memory: 4GiB, cpu: 2 }

states:
  refining:
    prompt: agents/release-plan.md
    env: default
    # **Sonnet, because every decision here has a written rule and a right answer.**
    # `agents/release-plan.md` states each of them with the command that answers it: the bump is
    # minor or patch by what the diff since the last `Version` commit touches, the Hetzner verdict
    # is one of three by the diff of named paths, and the two credential checks are commands that
    # pass or fail. `high` because the release notes are prose for whoever reads `git log` a year
    # on, and because `release-notes.md` is what a person approves before `publishing` runs — so a
    # weak reading is caught here and nowhere later.
    model: sonnet
    effort: high
    may_invoke:
      ghcr-check: { max: 3 }
      hetzner-check: { max: 3 }
    inputs: [ticket]
    produces: [release-notes.md]
    # Turns at 60, as on every job state here costing a few dollars: `.forge/common.yml`'s
    # `presenting` carries why. No release has been stopped by this ceiling — the raise is the
    # rule applied to the class, not a fix for something observed here.
    budget: { turns: 60, cost: 4.00 }

  publishing:
    prompt: agents/publish.md
    env: default
    # **No retry transition at all** (below), which it shares only with `common.yml`'s
    # `rebasing`, and for a different reason: this one pushes an image to GHCR and writes a
    # Hetzner snapshot, so a run that stops halfway has already written outside the repository.
    # Opus and `high`, named rather than inherited, because a project default set low would buy a
    # cheap reading of exactly the job whose mistakes cannot be undone by running it again.
    model: opus
    effort: high
    may_invoke:
      release-build: { max: 3 }
      hetzner-snapshot: { max: 2 }
    inputs: [release-notes.md]
    # `commit-message` because this workflow has no `presenting` state and `publishing` is the
    # equivalent last stop before `merged` (`.forge/common.yml`'s `presenting`).
    produces: [publish-report.md, changeset, commit-message]
    # `snapshot_failed` is a release half done: the image is published, so `VERSION` must still
    # land, but the worker snapshot it called for was not made, and machines a template starts go
    # on booting the old one. That is the case a person has to hear about before the ticket ends.
    outcomes: [done, snapshot_failed]
    # Turns at 60, and here the ceiling matters more than anywhere: `publishing` has no retry
    # transition (below), so a run its turn ceiling stops sticks the ticket having already
    # written to GHCR or Hetzner. The cost ceiling is the one meant to bind.
    budget: { turns: 60, cost: 4.00 }

  # Reached only on `snapshot_failed`: a person reads `publish-report.md`, retries the snapshot
  # by hand (`bin/hetzner-image`), and approves the merge.
  release_ready: {}

  merged:
    on_enter: merge

# `refining` gets one more attempt when it runs out of budget or stops without an answer, as
# every job state in `bug.yml` and `dev.yml` does. **`publishing` deliberately does not.** It
# pushes an image and builds a snapshot; a run that stopped halfway has already written to
# somewhere outside this repository, and what to do about that is a person's to decide from the
# log rather than the engine's to guess by running it again. So it still sticks, which is what
# sticking is for.
#
# **A release is approved once**, on `release-notes.md`, before anything is built. By the time
# `publishing` ends the image is pushed and cannot be taken back, so a second approval of the
# `VERSION` bump could only delay saying so on `main`. `done` therefore goes straight to `merged`
# with no `approve`, and the ticket concludes on its own (`docs/design/ticket-types.md`
# § Releases). `snapshot_failed` goes to `release_ready` instead, for the reason `publishing`
# gives, and there the merge waits for a person.
#
# Both edges queue, as in `bug.yml` and `dev.yml`: a release's commit takes its turn in the same
# line as every other ticket's. `merged` here names no `on_conflict`, so a release whose commit no
# longer merges sticks where it was queued from, with the conflicting paths, rather than going
# anywhere. All it changes is `VERSION`, and only one release is open at a time, so a conflict
# there means a release landed some other way meanwhile — which is a person's to sort out.
transitions:
  - { from: refining,      to: publishing,    approve: [release-notes.md] }
  - { from: publishing,    to: merged,        queue: true }
  - { from: publishing,    to: release_ready, when: snapshot_failed }
  - { from: release_ready, to: merged,        approve: [changeset], queue: true }

  - { from: refining,      to: refining,      when: budget_exhausted, max: 1 }
  - { from: refining,      to: refining,      when: did_not_converge, max: 1 }

limits:
  ticket_cost: 25.00
