defaults:
  resources: { memory: 2200MiB, cpu: 1 }

commands:
  check:
    run: .forge/commands/check.sh
    env: default
    produces: check.log
    timeout: 20m
    resources: { memory: 4GiB, cpu: 4 }

states:
  # `2` is the gate saying it could not run at all, which is not the gate saying no: the machine
  # is missing the devshell or a database it cannot start (`.forge/commands/check.sh`). It gets
  # its own outcome so that an environment failure does not spend the bound that exists for a fix
  # which keeps failing — three of ticket 1's three `checks_failed` were the machine's.
  checking:
    invoke: [check]
    exit: { 0: done, 2: gate_unavailable, "*": checks_failed }

  reviewing:
    prompt: agents/review.md
    env: default
    model: opus
    produces: [report.md]
    outcomes: [done, issues_found]
    budget: { turns: 120, cost: 15.00 }

  # A presentation (`produces: [presentation.md!]`): prose for the person deciding, drawn above
  # the diff on the review page with the source it quotes inline, read by no later state and
  # approved by nobody (`docs/design/workflow-grammar-v1.md` § Semantics).
  #
  # `optional`, so a ticket may reach review with no presentation: an agent with nothing worth
  # saying about a one-line fix should say nothing rather than pad. A project that wants one on
  # every ticket writes `optional: []` in the state that extends this — `extends` merges the
  # template's keys under the state's own, so a state that omits the key inherits this one. Then
  # add an edge out of `presenting` on `error`, or a ticket whose agent writes nothing sticks.
  presenting:
    prompt: agents/present.md
    env: default
    produces: [presentation.md!]
    optional: [presentation.md]
    budget: { turns: 40, cost: 3.00 }

  merged:
    on_enter: merge
    on_conflict: integrating

  integrating:
    prompt: agents/integrate.md
    env: default
    model: opus
    produces: [integration.md, changeset]
    budget: { turns: 100, cost: 8.00 }
