version: 1
description: Bug fixes to forge itself — reproduce, diagnose, fix the class, review, merge.
initial: refining
import: [common.yml]

states:
  refining:
    prompt: agents/refine-bug.md
    env: default
    inputs: [ticket]
    produces: [refinement.md]
    budget: { turns: 40, cost: 3.00 }

  # `implementation.md` is here because `implementing` sends the ticket back on
  # `diagnosis_invalid`, and a re-diagnosis that cannot read why it was sent back re-derives the
  # same diagnosis. It is optional — the way in from `refining` has written no implementation —
  # so the first diagnosis is handed nothing and told so.
  diagnosing:
    prompt: agents/diagnose.md
    env: default
    inputs: [ticket, refinement.md, implementation.md]
    produces: [diagnosis.md]
    budget: { turns: 60, cost: 4.00 }

  implementing:
    prompt: agents/implement-bug.md
    env: default
    model: opus
    may_invoke:
      check: { max: 10 }
    inputs: [ticket, refinement.md, diagnosis.md, report.md]
    produces: [implementation.md, changeset]
    outcomes: [done, diagnosis_invalid]
    budget: { turns: 200, cost: 15.00 }

  checking:
    extends: checking

  reviewing:
    extends: reviewing
    inputs: [refinement.md, diagnosis.md, implementation.md, changeset]

  review_ready: {}

  merged:
    extends: merged

  integrating:
    extends: integrating
    inputs: [diagnosis.md, changeset]

# The work of the ticket, first. Then the edges for the engine's own outcomes, which exist
# because a job that runs out of budget or stops without an answer used to leave the ticket
# stuck for a person to re-point at the state it had just left — three of ticket 1's four human
# interventions were exactly that, one of them for ninety minutes.
#
# One extra attempt each and no more: `max` is what keeps a retry from becoming a loop that
# spends the cost cap. `error` and `cancelled` are deliberately unhandled — `error` is something
# broken rather than something unfinished, and a cancelled ticket takes no transition at all —
# so both still stick, which is the right default for a fault nobody has read.
#
# **`reviewing` is the one state whose exhaustion is not retried.** A review that ran out of money
# spent it on subagents whose work a fresh attempt throws away, so the retry reached the same wall
# at the same price; `.forge/common.yml` has the runs that showed it. The edge goes to
# `review_ready` instead, where a person already reads `report.md` beside the diff, so a partial
# report lands in front of someone who can decide. It carries no `max`, which is safe only while
# nothing routes back into `reviewing` from there: `max: nil` never exhausts, so an edge from
# `review_ready` towards `implementing` would make this an uncapped loop and would have to cap it.
# `did_not_converge` keeps its retry: that is a review that had the budget and no answer, which
# another attempt can change.
#
# `integrating` gets none of these, and cannot: it is `merged`'s `on_conflict`, and the validator
# refuses a state reached by a conflict that any transition also leads into. The rule is right —
# an integration is a route out of a conflict, not a step anything else may jump into — and it
# was found by running the parser over this file rather than by reading it.
transitions:
  - { from: refining,     to: diagnosing,   approve: [refinement.md] }
  - { from: diagnosing,   to: implementing }
  - { from: implementing, to: checking }
  - { from: implementing, to: diagnosing,   when: diagnosis_invalid }
  - { from: checking,     to: reviewing }
  - { from: checking,     to: implementing, when: checks_failed,     max: 3 }
  - { from: reviewing,    to: review_ready }
  - { from: reviewing,    to: implementing, when: issues_found,      max: 3 }
  - { from: review_ready, to: merged,       approve: [changeset] }
  - { from: integrating,  to: checking }

  - { from: checking,     to: checking,     when: gate_unavailable,  max: 2 }
  - { from: refining,     to: refining,     when: budget_exhausted,  max: 1 }
  - { from: refining,     to: refining,     when: did_not_converge,  max: 1 }
  - { from: diagnosing,   to: diagnosing,   when: budget_exhausted,  max: 1 }
  - { from: diagnosing,   to: diagnosing,   when: did_not_converge,  max: 1 }
  - { from: implementing, to: implementing, when: budget_exhausted,  max: 1 }
  - { from: implementing, to: implementing, when: did_not_converge,  max: 1 }
  - { from: reviewing,    to: review_ready, when: budget_exhausted }
  - { from: reviewing,    to: reviewing,    when: did_not_converge,  max: 1 }

limits:
  # **Raised with `reviewing`'s budget, because the cap is what the loops have to fit inside.**
  # `within_ticket_budget?/2` is checked before each job starts, against what the ticket has
  # already spent, so what must stay under the cap is every running total — and the worst journey
  # these transitions allow is the way in plus three `issues_found` round-trips:
  #
  #     3 + 4 + 15 + 0 + 35            = 57     refining, planning, implementing, checking, review
  #     3 × (15 + 0 + 35)              = 150    three round-trips at `max: 3`
  #                                      ---
  #                                      207    of which 172 is spent before the last review
  #
  # At $120 the third round-trip stopped mid-loop, after $15 of implementing that was then never
  # checked or reviewed, and `max: 3` on `reviewing → implementing` could not be reached at all.
  # $210 clears the whole journey, the $172 it has spent before its last job included.
  # `project_workflows_test.exs` prices this out of the file itself, so the two numbers cannot
  # drift apart again.
  ticket_cost: 210.00
