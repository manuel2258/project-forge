<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Cool-violet greys; surfaces step 2% lightness" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}.m{font-family:var(--font-mono)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px"><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--bg);border:1px solid var(--border)"></div><span style="font-size:12.5px">page</span><span class="m" style="font-size:10.5px;opacity:.55">--bg</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--surface-1);border:1px solid var(--border)"></div><span style="font-size:12.5px">card</span><span class="m" style="font-size:10.5px;opacity:.55">--surface-1</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border)"></div><span style="font-size:12.5px">selected · strip</span><span class="m" style="font-size:10.5px;opacity:.55">--surface-2</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--border);border:1px solid var(--border)"></div><span style="font-size:12.5px">rule</span><span class="m" style="font-size:10.5px;opacity:.55">--border</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--chip);border:1px solid var(--border)"></div><span style="font-size:12.5px">bubble</span><span class="m" style="font-size:10.5px;opacity:.55">--chip</span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:44px;border-radius:6px;background:var(--ink);border:1px solid var(--border)"></div><span style="font-size:12.5px">text · primary</span><span class="m" style="font-size:10.5px;opacity:.55">--ink</span></div></div></body></html>
