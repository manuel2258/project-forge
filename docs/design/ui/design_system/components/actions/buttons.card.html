<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}button{font:inherit}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../components/_preview.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
(async () => {
const NS = await loadForge('../../');
const { Button } = NS;
const Row = ({ label, children }) => <div style={{ display:'flex', alignItems:'center', gap:10 }}><span style={{ width:92, fontFamily:'var(--font-mono)', fontSize:11, opacity:.55 }}>{label}</span>{children}</div>;
const App = () => <div style={{ padding:20, display:'flex', flexDirection:'column', gap:12 }}>
  <Row label="phone"><Button variant="primary">Send 1 answer</Button><Button variant="decision" size="md">Approve</Button><Button variant="outline" chevron style={{width:220}}>Review the changeset</Button></Row>
  <Row label="secondary"><Button variant="secondary" size="lg">Answer first</Button><Button variant="danger" size="lg">Reject</Button><Button variant="neutral" size="md">Merge</Button><Button variant="quiet">Later</Button></Row>
  <Row label="desktop"><Button variant="primary" size="desk">Issue it</Button><Button variant="decision" size="desk">Approve</Button><Button variant="secondary" size="desk-sm">Revoke</Button><Button variant="link">Read ›</Button></Row>
  <Row label="states"><Button variant="decision-open" size="md">Accept ▴</Button><Button variant="primary" disabled>Send 0 of 2</Button></Row>
</div>;
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script></body></html>
