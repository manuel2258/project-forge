<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}.m{font-family:var(--font-mono)}</style></head><body>
<div style="display:flex;gap:18px;align-items:center"><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:44px;border:1px solid var(--border-strong);border-radius:4px"></div><span class="m" style="font-size:11px;opacity:.6">4</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:44px;border:1px solid var(--border-strong);border-radius:5px"></div><span class="m" style="font-size:11px;opacity:.6">5</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:44px;border:1px solid var(--border-strong);border-radius:6px"></div><span class="m" style="font-size:11px;opacity:.6">6</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:44px;border:1px solid var(--border-strong);border-radius:8px"></div><span class="m" style="font-size:11px;opacity:.6">8</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:44px;border:1px solid var(--border-strong);border-radius:14px"></div><span class="m" style="font-size:11px;opacity:.6">14</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:44px;border:1px solid var(--border-strong);border-radius:999px"></div><span class="m" style="font-size:11px;opacity:.6">999</span></div><div style="flex:1"></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:120px;height:44px;background:var(--bg);box-shadow:var(--shadow-row),inset 2px 0 0 var(--accent);border-bottom:1px solid var(--border)"></div><span class="m" style="font-size:11px;opacity:.6">row</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:120px;height:44px;background:var(--surface-1);box-shadow:var(--shadow-panel);border-radius:0 0 14px
